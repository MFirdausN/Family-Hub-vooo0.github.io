/* ---------- reveal, count-up, chapter indicator ---------- */
const fmt=n=>Math.round(n).toLocaleString('id-ID');
function cnt(el){if(rm||!window.gsap)return;const o={v:0},n=+el.dataset.n;gsap.to(o,{v:n,duration:1.6,ease:'power2.out',onUpdate:()=>el.textContent=el.dataset.p+fmt(o.v)+el.dataset.s})}
function chat(){let i=0;const q=$('#q'),a=$('#a');(function step(){q.textContent='You: '+PR[i][0];a.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
setTimeout(()=>{a.innerHTML=PR[i][1];if(rm)return;setTimeout(()=>{i=(i+1)%PR.length;step()},3600)},1000)})()}
const rvs=[...document.querySelectorAll('.rv')];
if(!('IntersectionObserver' in window)){rvs.forEach(e=>e.classList.add('in'));chat()}else{
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');
el.querySelectorAll('[data-n]').forEach(cnt);if(el.dataset.n)cnt(el);
if(el.classList.contains('vault'))setTimeout(()=>el.querySelector('.lk').textContent='🔒',1900); // vault locks after docs enter
if(el.id==='chat')chat();io.unobserve(el)}),{threshold:.1,rootMargin:'0px 0px -8% 0px'});
rvs.forEach((el,i)=>{el.style.transitionDelay=(i%5)*70+'ms';io.observe(el)});
const co=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$('#ch').textContent=e.target.dataset.ch}),{rootMargin:'-45% 0px -45% 0px'});
document.querySelectorAll('section').forEach(s=>co.observe(s))}
$('#st').onclick=function(){this.textContent='TERIMA KASIH · SEGERA HADIR ✓'};
/* ---------- scroll progress (ScrollTrigger with scroll fallback) ---------- */
let P=0;const hd=$('#hd'),pg=$('#pg');
function onP(p){P=p;pg.style.transform=`scaleX(${p})`;hd.classList.toggle('s',scrollY>40)}
const sp=()=>onP(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));
addEventListener('scroll',sp,{passive:true});sp();
if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);
if(!mob&&!rm)gsap.utils.toArray('.v').forEach(el=>gsap.fromTo(el,{y:50},{y:-50,ease:'none',scrollTrigger:{trigger:el,start:'top bottom',end:'bottom top',scrub:true}}))}
setTimeout(()=>{$('#pre').classList.add('h');setTimeout(()=>$('#pre').remove(),900)},rm?500:1800);
/* ---------- persistent Three.js scene: one canvas, driven by scroll progress P ---------- */
let intro=1;
try{
const kf=(a,p)=>{for(let i=1;i<a.length;i++)if(p<=a[i][0]){const[x0,v0]=a[i-1],[x1,v1]=a[i];return v0+(v1-v0)*(p-x0)/(x1-x0)}return a[a.length-1][1]};
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const R=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:!mob,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,mob?1.5:2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100),grp=new THREE.Group();sc.add(grp);
const ADD=THREE.AdditiveBlending;
const tex=col=>{const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(k)};
const gt=tex('rgba(255,214,150,.9)');
const sprite=(o)=>new THREE.Sprite(new THREE.SpriteMaterial(Object.assign({map:gt,blending:ADD,depthWrite:false,transparent:true},o)));
const halo=sprite({opacity:.55});grp.add(halo);
const core=new THREE.Mesh(new THREE.SphereGeometry(.8,40,40),new THREE.MeshPhongMaterial({color:0xf2c887,emissive:0x8a5522,shininess:90}));grp.add(core);
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,2),new THREE.MeshBasicMaterial({color:0xf4ede3,wireframe:true,transparent:true,opacity:.14}));grp.add(shell);
sc.add(new THREE.AmbientLight(0xffffff,.5));const pl=new THREE.PointLight(0xffe2b0,1.2,30);pl.position.set(4,4,6);sc.add(pl);
// 8 ecosystem nodes on a ring, each with glow + letter-spaced label
const nd=['Family','Finance','Store','Boarding','Physio','Assets','Documents','Story'].map((n,i)=>{
const a=i/8*Math.PI*2-Math.PI/2,p=new THREE.Vector3(Math.cos(a)*3.5,Math.sin(i*1.7)*.9,Math.sin(a)*2.8);
const m=new THREE.Mesh(new THREE.SphereGeometry(.2,20,20),new THREE.MeshBasicMaterial({color:0xf4ede3,transparent:true}));
const h=sprite({opacity:.35});h.scale.set(1.3,1.3,1);m.add(h);
const k=document.createElement('canvas');k.width=256;k.height=64;const x=k.getContext('2d');x.font='500 24px Inter,sans-serif';x.fillStyle='#f4ede3';x.textAlign='center';x.fillText(n.toUpperCase().split('').join(' '),128,40);
const l=sprite({map:new THREE.CanvasTexture(k),blending:THREE.NormalBlending,opacity:.8,depthTest:false});l.scale.set(2,.5,1);l.position.y=.55;m.add(l);grp.add(m);return{p,m,h,l}});
// spokes (core→node) + ring (node→next node), buffer rewritten every frame so the final collapse works
const lp=new Float32Array(16*2*3),lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(lp,3));
const lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xe9b872,transparent:true,opacity:.35}));lines.frustumCulled=false;grp.add(lines);
// data streams: 24 bright points travelling along the spokes
const sg=new THREE.BufferGeometry(),sa=new Float32Array(72);sg.setAttribute('position',new THREE.BufferAttribute(sa,3));
const streams=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffe2b0,size:.08,transparent:true,depthWrite:false,blending:ADD}));streams.frustumCulled=false;grp.add(streams);
const N=mob?350:900,pp=new Float32Array(N*3);
for(let i=0;i<N;i++){const r=4+Math.random()*12,t=Math.random()*6.283,u=Math.acos(2*Math.random()-1);pp.set([r*Math.sin(u)*Math.cos(t),r*Math.cos(u),r*Math.sin(u)*Math.sin(t)],i*3)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const parts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf4ede3,size:.05,transparent:true,opacity:.6,depthWrite:false}));sc.add(parts);
const rs=()=>{R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',rs);rs();
let mx=0,my=0,cur=0;if(!mob&&!rm)addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
// camera / group keyframes over scroll progress: hero → travel → zoom out (ecosystem) → settle on lone core
const ZK=[[0,10],[.06,7.5],[.5,7],[.78,8],[.86,15],[.93,12],[1,8.5]],XK=[[0,1.6],[.06,2.5],[.8,2.5],[.86,0],[1,0]],YK=[[0,0],[.9,0],[1,1.4]];
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const t=rm?0:clock.getElapsedTime();cur+=(P-cur)*(rm?1:.07);
const f=ss(.9,.985,cur),it=intro; // f: 0→1 = "return to core" simplification
cam.position.set(mx*.8,-my*.5,rm?9:kf(ZK,cur));cam.lookAt(0,0,0);
grp.position.set(mob||rm?0:kf(XK,cur),kf(YK,cur),0);grp.rotation.set(.18,rm?.4:cur*Math.PI*2.4+t*.04,0);
core.scale.setScalar(Math.max(.001,it*(1+.03*Math.sin(t*.9))*(1-.1*f)));shell.rotation.y=t*.05*(1-.9*f);shell.scale.setScalar(it);
halo.scale.setScalar(4*it*(1-.35*f));halo.material.opacity=.32-.1*f;
// dim the whole scene behind text-heavy sections; full brightness for hero, ecosystem and finale
R.domElement.style.opacity=(mob?.4:.5)+(1-(mob?.4:.5))*(1-ss(.04,.12,cur)*(1-ss(.82,.88,cur)));
nd.forEach(n=>{const s=Math.max(.001,(1-f)*it);n.m.position.copy(n.p).multiplyScalar(s);n.m.scale.setScalar(s);n.m.material.opacity=1-f;n.h.material.opacity=.35*(1-f);n.l.material.opacity=.8*(1-f)});
let o=0;const q=nd.map(n=>n.m.position);
for(let i=0;i<8;i++){const a=q[i],b=q[(i+1)%8];lp.set([0,0,0,a.x,a.y,a.z,a.x,a.y,a.z,b.x,b.y,b.z],o);o+=12}
lg.attributes.position.needsUpdate=true;lines.material.opacity=.38*(1-f)*it;
for(let k=0;k<24;k++){const ph=(t*.25+k/24)%1,d=k<12?ph:1-ph,a=q[k%8];sa.set([a.x*(1-d),a.y*(1-d),a.z*(1-d)],k*3)}
sg.attributes.position.needsUpdate=true;streams.material.opacity=.95*(1-f)*it;
parts.rotation.y=t*(.012-.01*f);parts.scale.setScalar(3-2*it);parts.material.opacity=.6*(1-.85*f)*it;
R.render(sc,cam)})();
if(window.gsap&&!rm){intro=0;const o={v:0};gsap.to(o,{v:1,duration:1.7,ease:'power2.out',onUpdate:()=>intro=o.v})}
}catch(e){document.body.classList.add('nogl');console.warn('WebGL unavailable — HTML content only.',e)}
})();
